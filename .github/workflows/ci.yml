name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The core module needs Java 21. bbtree-vector and the benchmarks need Java 25.
          - java: "21"
            modules: "-pl bbtree"
          - java: "25"
            modules: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify ${{ matrix.modules }}
