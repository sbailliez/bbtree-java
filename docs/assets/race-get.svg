<svg xmlns="http://www.w3.org/2000/svg" width="700" height="276" viewBox="0 0 700 276" role="img" aria-label="concurrent get, 8 threads, 1M uint64 keys · AWS c7g · M ops/s: bbtree-java packed 38.5, Rust bbtree 34.3, Go bbtree-go 33.2, bbtree-java longToLong 28.5.">
